spring.application.name=Back

# 1. CORREÇÃO: Variáveis do Render (são USERNAME, PASSWORD e PORT)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 2. CORREÇÃO: O Driver CORRETO para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. CORREÇÃO: O Dialeto (Já estava certo)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. CORREÇÃO: DESLIGAR o Hibernate (O Flyway manda no banco)
spring.jpa.hibernate.ddl-auto=none

# Config do Flyway (Correto)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Segurança (Correto)
api.security.token.secret=${JWT_SECRET}


server.port=${PORT:8080}