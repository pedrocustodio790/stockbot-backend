spring.application.name=Back

# Configuração do banco de dados PostgreSQL (Render)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA (Hibernate) para PostgreSQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# DIZ AO HIBERNATE PARA NÃO MEXER NO BANCO (SÓ O FLYWAY MANDA)
spring.jpa.hibernate.ddl-auto=none

# Configuração do Flyway para PostgreSQL
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Segurança
api.security.token.secret=${JWT_SECRET}

# Servidor (O Render define a porta automaticamente)
server.port=${PORT:8080}