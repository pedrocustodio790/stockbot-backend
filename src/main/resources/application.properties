spring.application.name=Back

# --- 1. Conexão com Banco de Dados (Render) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- 2. Flyway (Migrações de Banco) ---
spring.flyway.enabled=true
# Cria a tabela de histórico do flyway se não existir
spring.flyway.baseline-on-migrate=true
# Permite rodar a aplicação mesmo se o checksum mudar (útil em dev)
spring.flyway.validate-on-migrate=false
# Corrige erros de migrações falhas automaticamente

# spring.flyway.repair=true

# --- 3. JPA / Hibernate ---

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# --- 5. Configurações Personalizadas (JWT e CORS) ---
api.security.token.secret=${JWT_SECRET}

# ? A MÁGICA DO CORS DINÂMICO:
# Se existir a variável de ambiente CORS_ORIGINS, usa ela.
# Se não existir (no seu PC), usa * (aceita tudo).
api.security.cors.origins=${CORS_ORIGINS:*}

# --- 6. Servidor ---
server.port=${PORT:8080}